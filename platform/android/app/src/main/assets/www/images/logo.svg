<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle with Glow -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="9.5" y="9.5" width="101" height="101" rx="26.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

  <!-- Stylized Open Book Wings -->
  <!-- Left Page -->
  <path d="M60 76 C50 68, 30 68, 22 75 C22 55, 32 46, 60 52 Z" fill="url(#pageGrad)" opacity="0.95" />
  <!-- Right Page -->
  <path d="M60 76 C70 68, 90 68, 98 75 C98 55, 88 46, 60 52 Z" fill="url(#pageGrad)" />
  <!-- Book Spine Center Column -->
  <path d="M60 52 L60 84" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Academic Mortarboard / Graduation Cap Motif -->
  <polygon points="60,26 88,38 60,50 32,38" fill="url(#accentGrad)" />
  <!-- Cap Cap Band / Tassel -->
  <path d="M60 50 L60 57 C60 60, 42 63, 42 57 L42 42" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <circle cx="88" cy="42" r="3" fill="#FDE047" />
  <path d="M88 42 L91 53" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />

  <!-- Modern Stylized "G" Monogram Crest in Center Base -->
  <path d="M60 83 C54 83, 49 86, 47 91 C45 96, 48 102, 54 103 C62 104, 67 99, 67 93 L67 91 L58 91" 
        fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
